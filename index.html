    <script type="text/javascript">
      applyI18n();
      document.getElementById("lang").value = LANG;
      document.getElementById("lang").addEventListener("change", (ev) => setLang(ev.target.value));

      function dismissNotification() {
        document.getElementById('notification-banner').classList.add('hidden');
        localStorage.setItem('notificationDismissed', 'true');
      }

      // Check if notification was previously dismissed
      if (localStorage.getItem('notificationDismissed') === 'true') {
        document.getElementById('notification-banner').classList.add('hidden');
      }

      function createSwitchAnimation() {
        let fromDiv,
            timerID;

        fromDiv = document.createElement("div");
        document.body.appendChild(fromDiv);

        return function animateSwitch(fromElem, targetBoundingRect) {
          fromDiv.className = "";

          Object.values(fromElem.style)
            .filter((v) => !(v in ["height", "width", "position"]))
            .forEach((key) => {
              let value = fromElem.style[key];
              fromDiv.style[key] = value;
            });

          const bounds = fromElem.getBoundingClientRect();
          fromDiv.style.width = bounds.width + "px";
          fromDiv.style.height = bounds.height + "px";
          fromDiv.style.top = bounds.top + "px";
          fromDiv.style.left = bounds.left + "px";
          
          clearTimeout(timerID);
          timerID = setTimeout(() => {
            fromDiv.className = "switch";

            const bounds = targetBoundingRect;
            fromDiv.style.width = bounds.width + "px";
            fromDiv.style.height = bounds.height + "px";
            fromDiv.style.top = bounds.top + "px";
            fromDiv.style.left = bounds.left + "px";
          }, 10);
        }
      }

      const animateSwitchFrom = createSwitchAnimation();
      const animateSwitchTo = createSwitchAnimation();

      const player = new PlayerRenderer();
      window.player = player;

      const ROWS = 8;
      const COLUMNS = 12;
      const OPTIMIZABLE = ["buildRate", "playerXp", "flaggy", "flagSpeed"];
      const GOAL_PRESETS = {
        balanced: { buildRate: 1, playerXp: 1, flaggy: 1, flagSpeed: 0 },
        // The small weights keep the other stats from dropping when it gains nothing.
        buildRate: { buildRate: 1, playerXp: 0.01, flaggy: 0.01, flagSpeed: 0 },
        playerXp: { buildRate: 0.01, playerXp: 1, flaggy: 0.01, flagSpeed: 0 },
        flaggy: { buildRate: 0.01, playerXp: 0.01, flaggy: 1, flagSpeed: 0 },
        flagSpeed: { buildRate: 0.01, playerXp: 0.01, flaggy: 0, flagSpeed: 1 },
      };

      const getInput = (id) => Number.parseFloat(document.getElementById(id).value);

      function applyGoal() {
        const goal = document.getElementById("goal").value;
        const preset = GOAL_PRESETS[goal];
        for (const elem of document.querySelectorAll("#settings .weights")) {
          elem.style.display = preset ? "none" : "";
        }
        if (preset) {
          for (const key of OPTIMIZABLE) document.getElementById(key).value = preset[key];
        }
      }
      document.getElementById("goal").addEventListener("change", applyGoal);

      function showScore(score, start) {
        const diff = (key) => start ? mmoifyNumber(score[key] - start[key]) : mmoifyNumber(score[key], false);
        const pct = (key) => start && start[key] ? ` (${(100 * (score[key] / start[key] - 1)).toFixed(1)}%)` : "";
        const hr = t("/HR");
        document.getElementById("buildrate").innerText = `${diff("buildRate")}${hr}${pct("buildRate")}`;
        document.getElementById("xpbonus").innerText = `${diff("playerXp")}${hr}${pct("playerXp")}, ${t("bonus")} ${mmoifyNumber(score.expBonus, false)}%`;
        document.getElementById("flaggyrate").innerText = `${diff("flaggy")}${hr}${pct("flaggy")}`;
        document.getElementById("flagspeed").innerText = `${diff("flagSpeed")}${hr}${pct("flagSpeed")}`;
        lastScores = [score, start];
      }
      let lastScores = null;

      function describeScore(score) {
        return t("BuildRate: {build}/HR, Player EXP: {xp}/HR (+{bonus}%), Flaggy: {flaggy}/HR, Flag speed: {flag}/HR", {
          build: mmoifyNumber(score.buildRate, false), xp: mmoifyNumber(score.playerXp, false), bonus: score.expBonus,
          flaggy: mmoifyNumber(score.flaggy, false), flag: mmoifyNumber(score.flagSpeed, false) });
      }
      const getFlaggyShop = getInput.bind(null, "flaggyShop");

      const createElem = function createElem(tagName, style=undefined) {
        const elem = document.createElement(tagName);
        if (style) {
          elem.style = style;
        }
        return elem;
      }
      
      window.g = {
        cogs: {},
        board: [],
        best: null
      };
      window.f = {};

      window.boardRenderer = new BoardRenderer(ROWS, COLUMNS, "board");
      window.spareRenderer = new BoardRenderer(40, 3, "spare", 5);
      // W7 tiny-cog side strips: 12 slots each, flanking the main board.
      window.smallLeftRenderer = new BoardRenderer(12, 1, "smallLeft", 12);
      window.smallRightRenderer = new BoardRenderer(12, 1, "smallRight", 12);
      window.solver = new Solver();
      window.cogInvetory = new CogInventory();

      window.sparePage = new Paginator("sparepage", window.spareRenderer._pageCount, 1);
      window.sparePage.addEventListener("change", (ev) => {
        window.spareRenderer.showPage(ev.page);
      });

      const boardElem = document.getElementById("currentBoard");
      boardElem.innerHTML = "";
      // boardElem.appendChild(table);
      const boardRow = createElem("div");
      boardRow.className = "board-with-sides";
      for (const renderer of [window.smallLeftRenderer, window.boardRenderer, window.smallRightRenderer]) {
        const table = renderer.createHTMLElement();
        if (renderer !== window.boardRenderer) {
          table.dataset.i18nTitle = "Tiny cog slot (World 7). Tiny cogs give a global bonus and are not moved by the solver.";
        }
        boardRow.appendChild(table);
      }
      applyI18n(boardRow);
      boardElem.appendChild(boardRow);

      const stepContainer = createElem("div");
      stepContainer.id = "stepspage";
      boardElem.appendChild(stepContainer);
      const stepsPage = new Paginator("stepspage", 0, 0, "Step");
      stepsPage.addEventListener("change", stepsChangeHandler);

      window.addEventListener("keyup", (ev) => {
        if (ev.key == "ArrowLeft") {
          stepsPage.prev(ev);
        } else if (ev.key == "ArrowRight") {
          stepsPage.next(ev);
        }
      }, true);

      const spareElem = document.getElementById("spare");
      const spareParent = spareElem.parentNode;
      spareParent.insertBefore(window.spareRenderer.createHTMLElement(), spareElem);
      spareParent.removeChild(spareElem);

      const settingsBtn = document.getElementById("settingsbtn");
      const slider = settingsBtn.querySelector(".checkbox");
      const settingsPage = document.getElementById("settings");
      const borderElem = document.getElementById("border");
      settingsBtn.addEventListener("click", () => {
        const active = slider.classList.contains("active");
        if (active) {
          slider.classList.remove("active");
          settingsPage.style.display = "none";
        } else {
          openCogTab();

          slider.classList.add("active");
          settingsPage.style.display = "";
        }
      })
      
      f.verifyBoardIntegrity = (board) => {
        for (let y = 0; y < board.length; y++) {
          for (let x = 0; x < board[y].length; x++) {
            if (board[y][x].blocked) continue;
            const tempPos = board[y][x].position();
            if (tempPos.x !== x || tempPos.y !== y) {
              debugger;
            }
          }
        }
      }
      
      f.printBoard = (board, cord1={},cord2={}) => {
        for (let i = 0; i < board.length; i++) {
          const row = createElem("tr");

          for (let j = 0; j < board[i].length; j++) {
            window.boardRenderer.set(i, j, board[i][j]);
          }
        }

        console.log("Board updated");
      }

      f.printSmallCogs = (inventory) => {
        // Left strip = slots 228-239 (t=0-11), right strip = 240-251 (t=12-23).
        // Locked slots (FlagUnlock[96+t] !== -11) render like blocked board cells.
        const locked = { blocked: true, fixed: true };
        // Only show the side strips once at least one tiny-cog slot is unlocked.
        boardRow.classList.toggle("no-tiny", !inventory.smallSlotUnlocked.some(Boolean));
        for (let row = 0; row < 12; row++) {
          window.smallLeftRenderer.set(row, 0,
            inventory.smallSlotUnlocked[row] ? inventory.smallCogs[228 + row] : locked);
          window.smallRightRenderer.set(row, 0,
            inventory.smallSlotUnlocked[12 + row] ? inventory.smallCogs[240 + row] : locked);
        }
      }

      f.printSpare = (inventory) => {
        for (let i = 108; i < 228; i++) {
          const cog = inventory.cogs[i] || inventory.smallCogs[i];
          const index = (i - 108);
          const row = Math.floor(index / 3);
          const col = index % 3;
          window.spareRenderer.set(row, col, cog);
        }
      }
      
      function yield() {
        return new Promise(r=>setTimeout(r,1));
      }
      
      f.printMove = (stepNumber, board, cog1, cog2, pos1, pos2, showStats = false) => {
        const toAdd = createElem("p");

        let text = t("Switch {from} [{fx}|{fy}]", { from: t(pos1.location), fx: pos1.x + 1, fy: pos1.y + 1 });
        if (showStats) {
          text += ` (${cog1.buildRate || 0}:${cog1.expBonus || 0}:${cog1.flaggy || 0})`;
        }
        text += ` <span style="background-image: url('${cog1.icon.path}')"></span> ` + t("with {to} [{tx}|{ty}]", { to: t(pos2.location), tx: pos2.x + 1, ty: pos2.y + 1 });
        if (showStats) {
          text += ` (${cog2.buildRate || 0}:${cog2.expBonus || 0}:${cog2.flaggy || 0})`;
        }
        text += ` <span style="background-image: url('${cog2.icon.path}')"></span>`;

        toAdd.innerHTML = text;

        toAdd.onclick = () => {
          stepsPage.goto(stepNumber);
        }
        document.getElementById("steps").appendChild(toAdd);
      }
      
      f.getOptimalSteps = (board, cogs) => {
        const steps = [];
        
        const cogsToMove = Object.values(cogs)
          .map(c=>{return new Cog(c)})
          .filter((c) => c.key !== c.initialKey);

        const interimCogs = {};
        for (const cog of cogsToMove) {
          interimCogs[cog.initialKey] = cog;
        }

        // Multi-step movements
        let tuple;
        while (tuple = Object.entries(interimCogs)[0]) {
          const [key, cog] = tuple;
          const targetCog = interimCogs[cog.key] || { icon: "Blank", key, position: cog.position.bind(cog) };
          if (targetCog === cog) {
            delete interimCogs[key];
            continue;
          }
          interimCogs[key] = targetCog;
          steps.push({
            board,
            cog,
            targetCog,
            keyFrom: Number.parseInt(key),
            keyTo: Number.parseInt(cog.key)
          });
          delete interimCogs[cog.key];
        }

        return steps;
      }

      f.printOptimalSteps = (steps) => {
        document.getElementById("steps").innerHTML = "";
        const showStats = document.getElementById("showStats").checked;

        for (let i = 0; i < steps.length; i++) {
          const step = steps[i];
          f.printMove(
            i,
            step.board,
            step.cog,
            step.targetCog,
            step.cog.position(step.keyFrom),
            step.targetCog.position(step.keyTo),
            showStats);
        }
      }

      function mmoifyNumber(num, addSign = true) {
        let str = num;
        //Fix from https://github.com/Monoblos/cogtimizer/pull/7/files, thanks https://github.com/Xythium
        const abs = Math.abs(num);

        if (abs >= 1_000_000_000_000) {
            str = (Math.ceil(num / 10_000_000_000) / 100) + "T";
        } else if (abs >= 1_000_000_000) {
            str = (Math.ceil(num / 10_000_000) / 100) + "B";
        } else if (abs >= 1_000_000) {
            str = (Math.ceil(num / 10_000) / 100) + "M";
        } else if (abs >= 1000) {
            str = (Math.ceil(num / 10) / 100) + "K";
        } else if (abs >= 10) {
            str = Math.round(num);
        } else {
            // Exact board totals are fractional; keep one decimal for small values.
            str = Math.round(num * 10) / 10;
        }

        if (addSign && num >= 0) {
          str = "+" + str;
        }

        return str.toString();
      }

      function showLoadError(msg) {
        let el = document.getElementById("loadError");
        if (!el) {
          el = createElem("p");
          el.id = "loadError";
          el.style.color = "#ff8a8a";
          el.style.maxWidth = "90ch";
          document.querySelector(".inputarea").appendChild(el);
        }
        el.textContent = msg || "";
        el.style.display = msg ? "" : "none";
      }

      function load(save) {
        try {
          cogInvetory.load(save);
        } catch (e) {
          console.error("Failed to load save:", e);
          showLoadError((e && e.message) || t("Could not read the save data."));
          openLoaderTab();
          return;
        }
        console.log("Loading");
        // A valid save that has no cogs / no unlocked slots can't be optimized.
        if (cogInvetory.cogKeys.length === 0 || cogInvetory.availableSlotKeys.length === 0) {
          showLoadError(t("Loaded, but the cog board looks empty (no cogs or no unlocked slots). Have you used the Construction cog board in-game and refreshed your profile on idleonefficiency.com?"));
        } else {
          showLoadError("");
        }
        // Fetch Gem-Shop flaggy upgrades
        document.getElementById("flaggyShop").value = cogInvetory.flaggyShopUpgrades;
        sparePage.goto(0);
        for (let i = 108; i < 228; i++) {
          const cog = cogInvetory.cogs[i] || cogInvetory.smallCogs[i];
          if (!cog) continue;
          const index = (i - 108);
          const row = Math.floor(index / 3); // 3 since the spare board has 3 columns per row
          const col = index % 3;
          window.spareRenderer.set(row, col, cog);
        };

        const initScore = cogInvetory.score;
        f.printBoard(cogInvetory.board);
        f.printSmallCogs(cogInvetory);
        lastSave = save;
        f.printAdvice(save);

        document.getElementById("solve").disabled = "";
        document.getElementById("steps").innerHTML = "";
        showScore(initScore);

        for (let oneOption of ["goal", ...OPTIMIZABLE, "solveTime"]) {
          const val = localStorage.getItem(oneOption);
          if (val) {
            document.getElementById(oneOption).value = val;
          }
        }
        applyGoal();


        openCogTab();
      }
      
      function fetchAndLoadConfig(username) {
        console.log("Trying to fetch", username);
        if (username.trim().length === 0) {
          showLoadError(t("Enter your username, or paste the \"Raw Data\" from idleonefficiency.com."));
          return;
        }
        const headers = {
          "Content-Type": "text/json",
          method: "GET"
        };
        fetch(`https://cdn.idleonefficiency.com/profiles/${username.toLowerCase()}.json`, headers)
        .then((response) => {
          if (!response.ok) {
            throw new Error(t("No profile found for \"{name}\" ({status}). Check the username or paste the Raw Data instead.", { name: username, status: response.status }));
          }
          return response.json();
        }).then((json) => {
          load(json);
        }).catch((reason) => {
          console.error(reason);
          showLoadError((reason && reason.message) || t("Couldn't load \"{name}\".", { name: username }));
        });
      }

      document.getElementById("load").addEventListener("click", () => {
        const input = document.getElementById("input").value;
        try {
          const save = JSON.parse(input);
          load(save);
        } catch (e) {
          if (e instanceof SyntaxError) {
            fetchAndLoadConfig(input);
          }
        }
      });
      
      let optimalSteps = undefined;

      function stepsChangeHandler(ev) {
        if (!optimalSteps || optimalSteps.length === 0) {
          return;
        }
        const clone = cogInvetory.clone();
        for (let i = 0; i < ev.page; i++) {
          const step = optimalSteps[i];
          clone.move(step.keyFrom, step.keyTo );
        }

        const currentStep = optimalSteps[ev.page];
        const pos1 = currentStep.cog.position(currentStep.keyFrom);
        const pos2 = currentStep.targetCog.position(currentStep.keyTo);

        // TODO Paddy: clone is now in the state _before_ the move, that should be displayed with the 2 positions highlighted.
        f.printBoard(clone.board);
        f.printSpare(clone);
        window.boardRenderer.move(pos1, pos2);

        if (pos1.location == "spare" || pos2.location == "spare") {
          let pos = pos1;
          if (pos2.location == "spare") {
            pos = pos2;
          }
          const page = window.spareRenderer.getPage(pos);
          if (page != -1) {
            sparePage.goto(page);
          }
        }

        window.spareRenderer.move(pos1, pos2);
        
        // Animation
        const renderer = {
          [window.boardRenderer._type]: window.boardRenderer,
          [window.spareRenderer._type]: window.spareRenderer
        };

        const pos1Slot = renderer[pos1.location].get(pos1.y, pos1.x);
        const pos2Slot = renderer[pos2.location].get(pos2.y, pos2.x);

        if (pos1Slot.item && pos1Slot.item.icon !== "Blank" && pos1Slot.elem.childNodes.length === 1) {
          const from = pos1Slot.elem.childNodes[0];
          animateSwitchFrom(from, pos2Slot.elem.getBoundingClientRect());
        }
        if (pos2Slot.item && pos2Slot.item.icon !== "Blank" && pos2Slot.elem.childNodes.length === 1) {
          const to = pos2Slot.elem.childNodes[0];
          animateSwitchTo(to, pos1Slot.elem.getBoundingClientRect());
        }
      }

      document.getElementById("solve").onclick = async () => {
        const solveTime = getInput("solveTime") || 2500;
        localStorage.setItem("solveTime", solveTime);
        document.getElementById("solvetext").innerText = t("Optimizing...");
        document.getElementById("steps").innerHTML = "";
        let lastYield = Date.now();
        await yield(); // Yield for DOM-Refresh

        console.log("Starting");

        let start = cogInvetory.clone();

        lastRun = { start: start.score, end: null };
        document.getElementById("start").innerText = t("Starting") + " " + describeScore(start.score);
        const weights = {};
        for (const key of OPTIMIZABLE) {
          weights[key] = getInput(key) || 0;
          localStorage.setItem(key, weights[key]);
        }
        localStorage.setItem("goal", document.getElementById("goal").value);
        // A new goal must not reuse the best board found for a previous one.
        if (JSON.stringify(weights) !== JSON.stringify(solver.weights)) g.best = null;
        solver.setWeights(weights);
        const best = await solver.solve(cogInvetory, solveTime);
        lastRun.end = best.score;
        document.getElementById("end").innerText = t("Final") + " " + describeScore(best.score);

        showScore(best.score, start.score);
        
        optimalSteps = f.getOptimalSteps(best.board, best.cogs);
        f.printOptimalSteps(optimalSteps);
        if (document.getElementById("showSolved").checked) {
          // Show solved board 
          f.printBoard(best.board);
          stepsPage.reset(optimalSteps.length, optimalSteps.length - 1);
        } else {
          f.printBoard(start.board);
          stepsPage.reset(optimalSteps.length, 0);
        }

        document.getElementById("solvetext").innerText = t("Solve");
        openCogTab();
      };
    
      // Construction checklist under the board, grouped by section; problems first.
      f.printAdvice = (save) => {
        const elem = document.getElementById("advice");
        elem.innerHTML = "";
        let items;
        try {
          items = new Advisor(save, cogInvetory).advise();
        } catch (e) {
          console.error("Advisor failed:", e);
          return;
        }
        const order = { warn: 0, tip: 1, ok: 2 };
        const icon = { warn: "!", tip: "?", ok: "✓" };
        const title = createElem("h3");
        title.innerText = t("Construction checklist");
        elem.appendChild(title);
        const hint = createElem("p");
        hint.className = "advice-hint";
        hint.innerText = t("Based on your save and the game's own formulas. ! = something to fix, ? = room to grow, ✓ = fine.");
        elem.appendChild(hint);
        for (const section of [...new Set(items.map(i => i.section))]) {
          const group = createElem("div");
          group.className = "advice-group";
          const h = createElem("h4");
          h.innerText = t(section);
          group.appendChild(h);
          const list = items.filter(i => i.section === section).sort((a, b) => order[a.level] - order[b.level]);
          for (const item of list) {
            const row = createElem("div");
            row.className = "advice-item advice-" + item.level;
            const mark = createElem("span");
            mark.className = "advice-mark";
            mark.innerText = icon[item.level];
            const text = createElem("div");
            const strong = createElem("b");
            strong.innerText = item.title;
            text.appendChild(strong);
            if (item.detail) {
              const detail = createElem("div");
              detail.className = "advice-detail";
              detail.innerText = item.detail;
              text.appendChild(detail);
            }
            row.appendChild(mark);
            row.appendChild(text);
            group.appendChild(row);
          }
          elem.appendChild(group);
        }
      };

      // Redraw everything that was built from text when the language changes.
      let lastSave = null, lastRun = null;
      window.addEventListener("langchange", () => {
        window.sparePage._updatePage();
        stepsPage._updatePage();
        if (lastScores) showScore(lastScores[0], lastScores[1]);
        if (lastRun) {
          document.getElementById("start").innerText = t("Starting") + " " + describeScore(lastRun.start);
          if (lastRun.end) document.getElementById("end").innerText = t("Final") + " " + describeScore(lastRun.end);
        }
        if (optimalSteps) {
          document.getElementById("steps").innerHTML = "";
          f.printOptimalSteps(optimalSteps);
        }
        if (lastSave) f.printAdvice(lastSave);
      });

      function openCogTab() {
        document.getElementById("loader").style.display = "none";
        document.getElementById("result").style.display = "inherit";
        document.getElementById("advice").style.display = document.getElementById("advice").childNodes.length ? "block" : "none";

        document.getElementById("loaderbtn").className = "";
        document.getElementById("cogbtn").className = "active";
      }

      function openLoaderTab() {
        document.getElementById("loader").style.display = "inherit";
        document.getElementById("result").style.display = "none";
        document.getElementById("advice").style.display = "none";

        document.getElementById("loaderbtn").className = "active";
        document.getElementById("cogbtn").className = "";
      }

      document.getElementById("loaderbtn").addEventListener("click", () => {
        openLoaderTab();
      });
      document.getElementById("cogbtn").addEventListener("click", () => {
        openCogTab();
      });
</script>
  </body>
</html>
